<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Sign Up </h1>
    <p>Please fill out the form to create an account.</p>
    <hr>
    <form action="/action_page.php" ></form>
        
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
        
        <label for="Repeat Password">Repeat Password</label><br>
        <input type="Repeat Password" id="repeat password" name="repeat password" placeholder="Enter your repeat password"><br><br>
        
        <input type="checkbox" id="remember me" name="remember me" value="remember me">
        <label for="remember me"> Remember me</label><br><br>

        <label for="Contact">Contact</label><br>
        <input type="contact" id="contact" name="contact" placeholder="Enter your contact number"><br><br>
        
        <label for="gender">Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male"> Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female"> Female</label><br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other"> Other</label><br><br>

        <p>By creating an account, you agree to our <a href="#">Terms and Privacy Policy.</a></p>
        <hr>
       
         <input type="submit" value="Sign Up">
         <input type="submit" value="Cancel">

    </form>

</body>
</html>

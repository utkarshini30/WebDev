<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      position: relative;

        background-image: url('hi.jpeg');
      background-size: cover;
      background-position: center;

      font-family: sans-serif;
      font-weight: bold;
    }

    p {
      position: absolute;
      margin: 10px;
    }

    .top-left     { top: 0; left: 0; }
    .top-right    { top: 0; right: 0; }
    .bottom-left  { bottom: 0; left: 0; }
    .bottom-right { bottom: 0; right: 0; }

    .top-center    { top: 0; left: 45%; }
    .bottom-center { bottom: 0; left: 45%; }
    .mid-left      { top: 45%; left: 0; }
    .mid-right     { top: 45%; right: 0; }
    .center        { top: 45%; left: 45%; }
  </style>
</head>
<body>
  <p class="top-left">Utkarshini Chaurasia</p>
  <p class="top-center">Utkarshini Chaurasia</p>
  <p class="top-right">Utkarshini Chaurasia</p>


  <p class="mid-left">Utkarshini Chaurasia</p>
  <p class="center">Utkarshini Chaurasia</p>
  <p class="mid-right">Utkarshini Chaurasia</p>

  <p class="bottom-left">Utkarshini Chaurasia</p>
  <p class="bottom-center">Utkarshini Chaurasia</p>
  <p class="bottom-right">Utkarshini Chaurasia</p>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 400px;
  height: 400px;
  background-color: blue;
  transition: width 2s, height 2s, background-color 2s;
}

div:hover {
  width: 600px;
  height: 400px;
  background-color: red;
}
</style>
</head>
<body>

<h1>The transition Property</h1>


<div></div>

</body>
</html>
